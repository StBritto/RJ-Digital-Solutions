<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="app.js"></script><style>*{box-sizing:border-box}body{font-family:system-ui;background:#071019;color:#f5f7fa;padding:24px 18px;margin:0}.back{font-size:28px;color:#9caeb9}.hero,.card{background:linear-gradient(145deg,#142633,#0c171f);border:1px solid #223a47;border-radius:22px;padding:18px;margin:12px 0}.muted{color:#8ea0ad}.amount{font-size:34px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{background:#00aa96;padding:14px;border-radius:15px;text-align:center;font-weight:750}.empty{text-align:center;padding:20px;color:#8ea0ad}</style></head><body><div class="back" onclick="history.back()">‹</div><div class="hero"><h1 id="title">Your split</h1><p id="meta" class="muted"></p><div id="total" class="amount">₹0</div></div><div class="actions"><div class="btn" onclick="location.href='add-expense.html'">＋ Add expense</div><div class="btn" onclick="location.href='receipt-scan.html'">Scan bill</div></div><div class="card"><h2>Expenses</h2><div id="expenses" class="empty">No expenses added yet.</div></div><script>const d=S.get('draftSplit',{}),es=d.expenses||[];title.textContent=d.name||'Your split';meta.textContent=[d.category,(d.people||[]).length?d.people.length+' people':'No people added'].filter(Boolean).join(' · ');total.textContent='₹'+es.reduce((s,e)=>s+(Number(e.amount)||0),0).toLocaleString('en-IN',{maximumFractionDigits:2});if(es.length){expenses.className='';expenses.innerHTML=es.map(e=>`<div style="padding:12px 0;border-bottom:1px solid #20343f"><b>${e.description}</b><span style="float:right">₹${Number(e.amount).toLocaleString('en-IN')}</span><br><small class="muted">${e.payer?'Paid by '+e.payer:''}</small></div>`).join('')}</script></body></html>
