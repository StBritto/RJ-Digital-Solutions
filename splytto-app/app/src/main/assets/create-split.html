<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="app.js"></script><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 85% 0,#17394a,#07131f 38%,#050a10 80%);color:#f7f8fa;margin:0;padding:26px 18px 40px;min-height:100vh}.back{font-size:26px;color:#9eb0bb}.sub{color:#8ea0ad;margin-top:-8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:22px}.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#162633,#0c151d);border:1px solid #263b48;border-radius:22px;min-height:116px;padding:13px;display:flex;flex-direction:column;justify-content:flex-end;transition:.15s}.card:before{content:'';position:absolute;inset:0 0 42% 0;background:var(--art);opacity:.95}.card span{position:relative;font-weight:700}.card small{position:relative;color:#8fa1ad}.sel{border:2px solid #55e5cf;box-shadow:0 0 0 2px rgba(85,229,207,.08),0 14px 35px rgba(0,0,0,.25)}.dinner{--art:radial-gradient(circle at 50% 70%,#c98545 0 12%,transparent 13%),linear-gradient(160deg,#472d20,#14171a)}.drive{--art:linear-gradient(165deg,#45606d 0 45%,#14191d 46% 58%,#a07137 59% 61%,#10151a 62%)}.trip{--art:linear-gradient(155deg,#668493 0 44%,#243a45 45% 57%,#c7a167 58% 61%,#17212a 62%)}.movie{--art:linear-gradient(145deg,#481c24,#15171b 55%,#9a6b2d)}.party{--art:radial-gradient(circle at 30% 35%,#9f6a48,transparent 18%),radial-gradient(circle at 70% 35%,#405b71,transparent 20%),linear-gradient(#221825,#10151b)}.lunch{--art:linear-gradient(145deg,#435b3d,#19231d 60%,#9a7042)}.snacks{--art:radial-gradient(circle at 52% 55%,#9a6d3e 0 20%,transparent 21%),linear-gradient(#2d2620,#12171b)}.shopping{--art:linear-gradient(145deg,#4b3942,#15181d 55%,#7d654b)}.scan{--art:linear-gradient(135deg,#0c7169,#093d43);border-color:#2cae9f}.name{width:100%;padding:16px;background:#0c151d;border:1px solid #2b3d49;color:white;border-radius:16px;font-size:17px;outline:none}.go{width:100%;padding:17px;border:0;border-radius:18px;background:linear-gradient(135deg,#00bfa6,#0a9486);color:#fff;font-weight:800;font-size:17px;margin-top:18px}.go:disabled{opacity:.45}
</style></head><body><div class="back" onclick="history.back()">‹</div><h1>What are we splitting?</h1><p class="sub">Choose the moment. We'll handle the numbers.</p><div class="grid" id="cats"><div class="card dinner" data-cat="Dinner"><span>Dinner</span></div><div class="card drive" data-cat="Drive"><span>Drive</span></div><div class="card trip" data-cat="Trip"><span>Trip</span></div><div class="card movie" data-cat="Movie"><span>Movie</span></div><div class="card scan" onclick="location.href='receipt-scan.html'"><span>Scan Bill</span><small>Receipt scanner</small></div><div class="card party" data-cat="Party"><span>Party</span></div><div class="card lunch" data-cat="Team Lunch"><span>Team Lunch</span></div><div class="card snacks" data-cat="Snacks"><span>Snacks</span></div><div class="card shopping" data-cat="Shopping"><span>Shopping</span></div></div><h3>Give it a name</h3><input id="splitName" class="name" placeholder="e.g. Goa weekend"><button id="go" class="go" disabled>Continue →</button><script>
let cat='';const go=document.getElementById('go'),nameEl=document.getElementById('splitName');document.querySelectorAll('[data-cat]').forEach(c=>c.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');cat=c.dataset.cat;validate()});nameEl.oninput=validate;function validate(){go.disabled=!(cat&&nameEl.value.trim())}go.onclick=()=>{S.set('draftSplit',{category:cat,name:nameEl.value.trim(),people:[],expenses:[]});location.href='add-people.html'}
</script></body></html>
