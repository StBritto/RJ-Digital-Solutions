<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="app.js"></script><style>*{box-sizing:border-box}body{font-family:system-ui;background:#071019;color:#f5f7fa;padding:24px 18px;margin:0}.back{font-size:28px;color:#9caeb9}.card{background:#101d26;border:1px solid #213743;border-radius:20px;padding:16px;margin:12px 0}.in,select,textarea{width:100%;padding:14px;background:#09131a;border:1px solid #29404c;border-radius:14px;color:white;margin:6px 0 12px;font-size:16px}.btn{width:100%;border:0;border-radius:17px;padding:16px;background:#00aa96;color:white;font-weight:800}.muted{color:#8ea0ad}.secondary{background:#142832;border:1px solid #2d4b57;margin-bottom:10px}</style></head><body><div class="back" onclick="history.back()">‹</div><h1>Add expense</h1><p class="muted">Nothing is pre-filled. Enter the details for this expense.</p><div class="card"><label>Description</label><input id="desc" class="in" placeholder="e.g. Dinner"><label>Amount</label><input id="amount" class="in" type="number" step="0.01" min="0" placeholder="₹0.00"><label>Paid by</label><select id="payer"><option value="" selected disabled>Select a person</option></select><label>Category</label><select id="category"><option value="" selected disabled>Select a category</option><option>Dinner</option><option>Drive</option><option>Trip</option><option>Movie</option><option>Party</option><option>Team Lunch</option><option>Snacks</option><option>Shopping</option><option>Other</option></select><label>Place (optional)</label><input id="place" class="in" placeholder="Enter place"><label>Note (optional)</label><textarea id="note" placeholder="Add a note"></textarea></div><button class="btn secondary" onclick="location.href='receipt-scan.html'">Scan a receipt instead</button><button class="btn" onclick="saveExpense()">Save expense</button><script>const d=S.get('draftSplit',{});(d.people||[]).forEach(p=>payer.insertAdjacentHTML('beforeend',`<option>${p}</option>`));function saveExpense(){if(!desc.value.trim()||!(Number(amount.value)>0)||!payer.value||!category.value){alert('Enter a description and amount, then select who paid and a category.');return}const e={description:desc.value.trim(),amount:Number(amount.value),payer:payer.value,category:category.value,place:place.value.trim(),note:note.value.trim()};d.expenses=d.expenses||[];d.expenses.push(e);S.set('draftSplit',d);location.href='event-dashboard.html'}</script></body></html>
