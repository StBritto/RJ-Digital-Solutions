<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="app.js"></script><style>*{box-sizing:border-box}body{font-family:system-ui;background:#071019;color:#f5f7fa;padding:24px 18px;margin:0}.back{font-size:28px;color:#9caeb9}.input{width:100%;padding:15px;margin:8px 0;background:#101d26;border:1px solid #29404c;border-radius:15px;color:white;font-size:16px}.row{display:flex;justify-content:space-between;align-items:center;background:#101d26;border:1px solid #213743;border-radius:16px;padding:14px;margin:9px 0}.remove{color:#91a1ad}.primary{width:100%;border:0;border-radius:17px;padding:16px;background:#00aa96;color:white;font-weight:800;margin-top:18px}.primary:disabled{opacity:.4}.muted{color:#8ea0ad}</style></head><body><div class="back" onclick="history.back()">‹</div><h1>Add people</h1><p class="muted">Start empty. Add only the people who are part of this split.</p><input id="person" class="input" placeholder="Enter a name" autocomplete="off"><button class="primary" style="margin-top:4px" onclick="add()">＋ Add person</button><div id="list"></div><button id="create" class="primary" disabled onclick="createSplit()">Create split</button><script>let people=[];function draw(){list.innerHTML='';people.forEach((p,i)=>list.insertAdjacentHTML('beforeend',`<div class="row"><span>${p}</span><span class="remove" onclick="removePerson(${i})">Remove</span></div>`));create.disabled=!people.length}function add(){const v=person.value.trim();if(!v)return;if(!people.includes(v))people.push(v);person.value='';draw()}function removePerson(i){people.splice(i,1);draw()}function createSplit(){const d=S.get('draftSplit',{});d.people=people;S.set('draftSplit',d);location.href='event-dashboard.html'}person.addEventListener('keydown',e=>{if(e.key==='Enter')add()});draw()</script></body></html>
