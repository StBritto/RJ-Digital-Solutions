<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="app.js"></script><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 70% 0,#17394a,#07131f 40%,#050a10);color:#f5f7fa;padding:24px 20px;min-height:100vh;margin:0}.back{font-size:28px;color:#a3b3bd}.hero{margin:24px 0}.hero p{color:#91a2ad}.frame{height:300px;border:1px solid #31505d;border-radius:26px;background:linear-gradient(145deg,#122735,#09151e);display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:inset 0 0 60px rgba(35,224,196,.04)}.corners{font-size:44px;color:#5ee6d1}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.btn{border:1px solid #2d4b57;background:#11232d;color:white;border-radius:18px;padding:17px;text-align:center;font-weight:750}.primary{background:linear-gradient(135deg,#00bfa6,#0a9184);border:0}.status{color:#8fa1ad;text-align:center;margin:18px 0;min-height:24px}
</style></head><body><div class="back" onclick="history.back()">‹</div><div class="hero"><h1>Scan your bill</h1><p>Use a clear, straight photo. Splytto reads the receipt on your phone and lets you review it before splitting.</p></div><div class="frame"><div><div class="corners">⌜　⌝<br>⌞　⌟</div><strong>Place the receipt inside the frame</strong></div></div><div class="actions"><div class="btn primary" onclick="camera()">Camera</div><div class="btn" onclick="gallery()">Gallery</div></div><div class="status" id="status">Nothing is uploaded until you choose a receipt.</div><script>
function camera(){if(window.AndroidBridge)AndroidBridge.captureReceipt();else status.textContent='Camera is available in the Android app.'}function gallery(){if(window.AndroidBridge)AndroidBridge.pickReceipt();else status.textContent='Gallery is available in the Android app.'}
window.splyttoScanStarted=()=>status.textContent='Reading receipt…';window.splyttoScanError=m=>status.textContent=m;window.splyttoReceiptText=t=>{S.set('receiptText',t);location.href='selective-expense.html'}
</script></body></html>
