<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="app.js"></script><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#071019;color:#f5f7fa;padding:24px 18px;margin:0;min-height:100vh}.back{font-size:28px;color:#9caeb9}.item{display:grid;grid-template-columns:1fr 110px;gap:10px;background:#101d26;border:1px solid #213743;border-radius:17px;padding:13px;margin:9px 0}.item input{width:100%;background:#09131a;color:white;border:1px solid #2b414d;border-radius:10px;padding:10px}.muted{color:#8ea0ad}.btn{margin-top:18px;width:100%;border:0;border-radius:17px;padding:16px;background:#00aa96;color:white;font-weight:800}.empty{padding:30px 10px;text-align:center;color:#8ea0ad}
</style></head><body><div class="back" onclick="history.back()">‹</div><h1>Review receipt</h1><p class="muted">Check the detected items and prices before assigning them.</p><div id="items"></div><button class="btn" id="continue" style="display:none" onclick="save()">Continue to assign</button><script>
const raw=S.get('receiptText','');function parse(text){const rows=[];for(const line of text.split(/\n+/)){const m=line.trim().match(/^(.+?)\s+(?:₹|Rs\.?\s*)?(\d+(?:\.\d{1,2})?)$/i);if(m&&m[1].length>1){const v=Number(m[2]);if(v>0&&v<100000)rows.push({name:m[1].trim(),amount:v})}}return rows.slice(0,40)}let rows=parse(raw),box=document.getElementById('items');if(!rows.length){box.innerHTML='<div class="empty">No item lines were confidently detected. Go back and try a clearer receipt photo.</div>'}else{rows.forEach((r,i)=>box.insertAdjacentHTML('beforeend',`<div class="item"><input id="n${i}" value="${r.name.replace(/"/g,'&quot;')}"><input id="a${i}" type="number" step="0.01" value="${r.amount}"></div>`));document.getElementById('continue').style.display='block'}function save(){const out=rows.map((_,i)=>({name:document.getElementById('n'+i).value.trim(),amount:Number(document.getElementById('a'+i).value)||0})).filter(x=>x.name&&x.amount>0);S.set('receiptItems',out);S.set('draftExpense',{source:'receipt',items:out});location.href='add-people.html'}
</script></body></html>
