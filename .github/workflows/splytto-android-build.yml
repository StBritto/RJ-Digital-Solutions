name: Build Splytto Android APK

on:
  push:
    branches: [splytto-android-build]
    paths:
      - 'splytto-app/**'
      - '.github/workflows/splytto-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: splytto-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Splytto-v1.2-debug-apk
          path: splytto-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
